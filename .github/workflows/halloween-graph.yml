name: halloween graph

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The contribution grid in GitHub's Halloween colours, eaten by a purple snake.
      # color_dots: empty cell first, then the four contribution levels.
      - name: generate the graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/halloween-graph.svg?color_snake=#7c3aed&color_dots=#ebedf0,#ffee4a,#ffc501,#fe9600,#03001c
            dist/halloween-graph-dark.svg?palette=github-dark&color_snake=#a855f7&color_dots=#161b22,#631c03,#bd561d,#fa7a18,#fddf68

      - name: push it to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update the Halloween graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
