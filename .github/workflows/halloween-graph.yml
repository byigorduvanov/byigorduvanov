name: halloween graph

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: halloween-graph
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # The snake and its grid; colours match THEMES in scripts/graph.py (empty cell first, then the four levels).
      - name: draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/halloween-graph.svg?color_snake=#7c3aed&color_dots=#ebedf0,#ffee4a,#ffc501,#fe9600,#03001c
            snake/halloween-graph-dark.svg?palette=github-dark&color_snake=#a855f7&color_dots=#151b23,#631c03,#bd561d,#fa7a18,#fddf68

      # The README graph has one image per day so hovering a day shows its count; the snake graph is published
      # to the output branch too but is not in the README, since it cannot carry per-day titles.
      - name: draw the graphs
        run: |
          python3 scripts/graph.py "${{ github.repository_owner }}" dist snake
          python3 scripts/hover_graph.py "${{ github.repository_owner }}" dist/hover README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push the images to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "Update the Halloween graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Day counts live in the README's image titles, so it changes whenever a count does.
      - name: commit the README
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the contribution graph" README.md
          git push
