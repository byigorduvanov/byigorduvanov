name: halloween graph

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # The snake and its grid; colours match THEMES in scripts/graph.py (empty cell first, then the four levels).
      - name: draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/halloween-graph.svg?color_snake=#7c3aed&color_dots=#ebedf0,#ffee4a,#ffc501,#fe9600,#03001c
            snake/halloween-graph-dark.svg?palette=github-dark&color_snake=#a855f7&color_dots=#151b23,#631c03,#bd561d,#fa7a18,#fddf68

      # The profile contribution graph, same layout and labels, with the snake inside it.
      - name: draw the graph
        run: python3 scripts/graph.py "${{ github.repository_owner }}" dist snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push it to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "Update the Halloween graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
